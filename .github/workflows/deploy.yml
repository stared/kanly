name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      # the sources (KANJIDIC2, KanjiVG, JMdict…) are downloaded once and kept until the build script changes
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('scripts/build_data.py') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm data
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_PROJECT_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
